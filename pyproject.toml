[project]
name = "agent-speak"
version = "0.5.1dev1"
description = "Let LLMs talk back with rich HTML instead of markdown."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.3.1",
    "starlette>=1.0.0",
    "uvicorn>=0.47.0",
    "openai>=1.0.0",
]

[project.scripts]
agent-speak = "agent_speak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_speak"]
